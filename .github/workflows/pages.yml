name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'screenshots/opentakengine/**'
      - 'scripts/site_build.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet markdown==3.8
          gh api "repos/${{ github.repository }}/releases" > releases.json
          python3 scripts/site_build.py _site --releases releases.json --repo "${{ github.repository }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
