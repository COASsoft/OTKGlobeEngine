name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'screenshots/opentakengine/**'
      - 'scripts/site_downloads.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/shots
          cp site/* _site/
          cp screenshots/opentakengine/*.png _site/shots/
          gh api "repos/${{ github.repository }}/releases" > releases.json
          python3 scripts/site_downloads.py releases.json _site/download.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
