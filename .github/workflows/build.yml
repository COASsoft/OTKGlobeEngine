name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: otkglobeengine-windows
          path: build/apps/viewer/otk_viewer.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libgdal-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTK_WITH_GDAL=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - name: Pregenerated shaders match the sources
        run: |
          cmake --build build --target otk_pregenerate_shaders
          git diff --exit-code -- src/render/shaders/generated
      - uses: actions/upload-artifact@v4
        with:
          name: otkglobeengine-linux
          path: build/apps/viewer/otk_viewer

  raspberry-pi:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev libx11-dev libxi-dev libxcursor-dev libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri xvfb xauth
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTK_GLES=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - name: Render a frame with OpenGL ES through EGL
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./build/apps/viewer/otk_viewer --offscreen 1 --shot shot.png --size 640x360 --shot-timeout 60
          test -s shot.png
      - uses: actions/upload-artifact@v4
        with:
          name: otkglobeengine-raspberry-pi
          path: |
            build/apps/viewer/otk_viewer
            shot.png
            shot.png.txt

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTK_ENGINE=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  bsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            version: '15.1'
          - os: openbsd
            version: '7.9'
          - os: netbsd
            version: '11.0'
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Start ${{ matrix.os }} ${{ matrix.version }}
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: x86-64
          cpu_count: 4
          memory: 8G
      - name: Build, test and package
        run: env OTK_PACKAGE=1 sh scripts/bsd_build.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: otkglobeengine-macos
          path: build/apps/viewer/otk_viewer.app

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
      - run: cmake --build build --config Release -- CODE_SIGNING_ALLOWED=NO

  apple-xcframework:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/apple_xcframework.sh
      - name: Typecheck Swift view for macOS and iOS
        run: |
          mkdir -p build/swiftcheck
          cp include/otk/otk.h build/swiftcheck/
          echo 'module OTKGlobeEngineC {' > build/swiftcheck/module.modulemap
          echo '    header "otk.h"' >> build/swiftcheck/module.modulemap
          echo '    export *' >> build/swiftcheck/module.modulemap
          echo '}' >> build/swiftcheck/module.modulemap
          xcrun --sdk macosx swiftc -typecheck -target arm64-apple-macos12 -I build/swiftcheck bindings/apple/OTKGlobeView.swift
          xcrun --sdk iphoneos swiftc -typecheck -target arm64-apple-ios15.0 -I build/swiftcheck bindings/apple/OTKGlobeView.swift
      - run: cd build/apple && zip -qry OTKGlobeEngine.xcframework.zip OTKGlobeEngine.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: otkglobeengine-xcframework
          path: build/apple/OTKGlobeEngine.xcframework.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: python3 scripts/android_apk.py
      - run: python3 scripts/android_aar.py
      - uses: actions/upload-artifact@v4
        with:
          name: otkglobeengine-android
          path: |
            build/android-arm64-v8a/otkglobeengine-viewer.apk
            build/otkglobeengine-*.aar

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: python3 scripts/web_build.py --pack
      - uses: actions/upload-artifact@v4
        with:
          name: otkglobeengine-web
          path: build/otkglobeengine-*.tgz
